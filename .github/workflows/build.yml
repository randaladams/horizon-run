name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk HorizonRun.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HorizonRun-apk
          path: HorizonRun.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest HorizonRun.apk \
            --target "${{ github.sha }}" \
            --title "Horizon Run — build ${{ github.run_number }}" \
            --notes "Open this page on your Android phone and tap HorizonRun.apk to download and install." \
            --latest
