plugins {
    id 'com.android.application'
}

// Each GitHub build gets a higher version number so the new version installs over the old one.
def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

// Play Store upload key: provided by GitHub secrets (see .github/workflows/build.yml).
// Without it, builds fall back to the shared test key in this repo, which is fine
// for side-loading on your own phone but must never be used for the Play Store.
def uploadStore = System.getenv("UPLOAD_KEYSTORE_FILE")

android {
    namespace 'com.horizonrun.game'
    compileSdk 36

    defaultConfig {
        applicationId "com.adamselite.horizonrun"
        minSdk 26
        targetSdk 36
        versionCode buildNumber
        versionName "1.2.${buildNumber}"
        // The hidden free/full test switch only exists in the side-loaded test APK,
        // never in the Play Store bundle (which is the one signed with the upload key).
        buildConfigField "boolean", "ALLOW_TEST_UNLOCK", uploadStore ? "false" : "true"

        // AdMob: the Play Store bundle uses the real ids; the side-loaded test APK always
        // uses Google's public test ids, so the developer's phone can never load a real ad.
        def realAds = uploadStore != null
        manifestPlaceholders = [admobAppId: realAds
                ? "ca-app-pub-7909301840077799~4928575733"
                : "ca-app-pub-3940256099942544~3347511713"]
        buildConfigField "String", "ADMOB_REWARDED", realAds
                ? '"ca-app-pub-7909301840077799/1857805248"'
                : '"ca-app-pub-3940256099942544/5224354917"'
        buildConfigField "String", "ADMOB_INTERSTITIAL", realAds
                ? '"ca-app-pub-7909301840077799/5821100980"'
                : '"ca-app-pub-3940256099942544/1033173712"'
    }

    buildFeatures {
        buildConfig true
    }

    // Two builds of the same game:
    //  - phone:  the Google Play version (tilt + touch, AdMob ads, Play Billing upgrade)
    //  - firetv: Amazon Fire TV (Fire OS 6+). Played with the remote, full version
    //            unlocked, no Google ads or billing (Fire TV has no Google Play services).
    flavorDimensions = ["device"]
    productFlavors {
        phone {
            dimension "device"
            buildConfigField "boolean", "FIRE_TV", "false"
        }
        firetv {
            dimension "device"
            minSdk 25                      // Fire OS 6 (Fire TV Stick 4K, 1st gen) is Android 7.1
            versionNameSuffix "-firetv"
            buildConfigField "boolean", "FIRE_TV", "true"
            buildConfigField "boolean", "ALLOW_TEST_UNLOCK", "false"
        }
    }

    signingConfigs {
        shared {
            storeFile file('horizonrun.keystore')
            storePassword 'horizonrun'
            keyAlias 'horizonrun'
            keyPassword 'horizonrun'
        }
        if (uploadStore) {
            upload {
                storeFile file(uploadStore)
                storePassword System.getenv("UPLOAD_KEYSTORE_PASSWORD")
                keyAlias System.getenv("UPLOAD_KEY_ALIAS") ?: "upload"
                keyPassword System.getenv("UPLOAD_KEY_PASSWORD") ?: System.getenv("UPLOAD_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig uploadStore ? signingConfigs.upload : signingConfigs.shared
        }
    }

    lint {
        // Calling something newer than the device's Android version crashes there (Fire OS 6
        // is Android 7.1), so make that a build failure instead of a warning.
        fatal 'NewApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // java.time (holiday dates) only arrived in Android 8; this backports it for Fire OS 6.
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    // Google ads and billing: phone build only.
    phoneImplementation 'com.google.android.gms:play-services-ads:23.6.0'
    phoneImplementation 'com.google.android.ump:user-messaging-platform:3.1.0'
    phoneImplementation 'com.android.billingclient:billing:8.0.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
