plugins {
    id 'com.android.application'
}

// Each GitHub build gets a higher version number so the new version installs over the old one.
def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

// Play Store upload key: provided by GitHub secrets (see .github/workflows/build.yml).
// Without it, builds fall back to the shared test key in this repo, which is fine
// for side-loading on your own phone but must never be used for the Play Store.
def uploadStore = System.getenv("UPLOAD_KEYSTORE_FILE")

android {
    namespace 'com.horizonrun.game'
    compileSdk 36

    defaultConfig {
        applicationId "com.horizonrun.game"
        minSdk 26
        targetSdk 36
        versionCode buildNumber
        versionName "1.1.${buildNumber}"
    }

    signingConfigs {
        shared {
            storeFile file('horizonrun.keystore')
            storePassword 'horizonrun'
            keyAlias 'horizonrun'
            keyPassword 'horizonrun'
        }
        if (uploadStore) {
            upload {
                storeFile file(uploadStore)
                storePassword System.getenv("UPLOAD_KEYSTORE_PASSWORD")
                keyAlias System.getenv("UPLOAD_KEY_ALIAS") ?: "upload"
                keyPassword System.getenv("UPLOAD_KEY_PASSWORD") ?: System.getenv("UPLOAD_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig uploadStore ? signingConfigs.upload : signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.1.0'
}
